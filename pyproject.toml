[project]
name = "podmaxxer"
version = "0.1.0"
description = "Stateful CLI that downloads podcasts, articles, and videos and summarizes them"
readme = "README.md"
authors = [
    { name = "Shayan Raghavjee", email = "shayan.raghavjee@spandigital.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "faster-whisper>=1.2.1",
    "platformdirs>=4.11.0",
    "requests>=2.34.2",
    "trafilatura>=2.1.0",
]

[project.scripts]
podmaxxer = "podmaxxer.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "responses>=0.26.2",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src"]
