[project]
name = "podmaxxer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shayan Raghavjee", email = "shayan.raghavjee@spandigital.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "faster-whisper>=1.2.1",
    "platformdirs>=4.11.0",
    "requests>=2.34.2",
    "trafilatura>=2.1.0",
]

[project.scripts]
podmaxxer = "podmaxxer.cli:main"

[[tool.uv.index]]
url = "https://pypi.apple.com/simple"
default = true

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.2",
    "ruff>=0.16.0",
]
